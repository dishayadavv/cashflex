<div class="auth-page">

  <div class="auth-brand">

    <div class="brand-mark">
      ₹
    </div>

    <div>
      <strong>CashFlex</strong>
      <span>Smart money planner</span>
    </div>

  </div>


  <main class="auth-card">

    <div class="auth-heading">

      <p class="eyebrow">
        WELCOME BACK
      </p>

      <h1>
        Sign in
      </h1>

      <p>
        Take control of your money, one decision at a time.
      </p>

    </div>


    <form (ngSubmit)="login()">

      <div class="form-group">

        <label>
          Email address
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
        />

      </div>


      <div class="form-group">

        <div class="password-label">

          <label>
            Password
          </label>

        </div>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />

      </div>


      @if (errorMessage) {

        <div class="error-message">
          {{ errorMessage }}
        </div>

      }


      <button
        class="login-button"
        type="submit"
        [disabled]="loading"
      >

        @if (loading) {
          Signing in...
        } @else {
          Sign in
        }

      </button>

    </form>


    <div class="auth-divider">
      <span>NEW TO CASHFLEX?</span>
    </div>


    <a
      routerLink="/signup"
      class="signup-link"
    >
      Create an account
      <span>→</span>
    </a>

  </main>


  <p class="auth-footer">
    CashFlex · Personal Finance Planner
  </p>

</div>

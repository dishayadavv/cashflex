<div class="auth-page">

  <!-- BRAND -->

  <div class="auth-brand">

    <div class="brand-mark">
      ₹
    </div>

    <div>

      <strong>
        CashFlex
      </strong>

      <span>
        Smart money planner
      </span>

    </div>

  </div>


  <!-- SIGNUP CARD -->

  <main class="auth-card">

    <div class="auth-heading">

      <p class="eyebrow">
        GET STARTED
      </p>

      <h1>
        Create account
      </h1>

      <p>
        Start building a clearer relationship with your money.
      </p>

    </div>


    <!-- FORM -->

    <form (ngSubmit)="signup()">


      <!-- NAME -->

      <div class="form-group">

        <label>
          Full name
        </label>

        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Your name"
          autocomplete="name"
        />

      </div>


      <!-- EMAIL -->

      <div class="form-group">

        <label>
          Email address
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
        />

      </div>


      <!-- PASSWORD -->

      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
        />

      </div>


      <!-- CONFIRM PASSWORD -->

      <div class="form-group">

        <label>
          Confirm password
        </label>

        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Re-enter your password"
          autocomplete="new-password"
        />

      </div>


      <!-- ERROR -->

      @if (errorMessage) {

        <div class="error-message">
          {{ errorMessage }}
        </div>

      }


      <!-- SUCCESS -->

      @if (successMessage) {

        <div class="success-message">
          {{ successMessage }}
        </div>

      }


      <!-- SIGNUP BUTTON -->

      <button
        class="signup-button"
        type="submit"
        [disabled]="loading"
      >

        @if (loading) {

          Creating account...

        } @else {

          Create account

        }

      </button>

    </form>


    <!-- DIVIDER -->

    <div class="auth-divider">

      <span>
        ALREADY HAVE AN ACCOUNT?
      </span>

    </div>


    <!-- LOGIN -->

    <a
      routerLink="/login"
      class="login-link"
    >

      Sign in

      <span>
        →
      </span>

    </a>

  </main>


  <!-- FOOTER -->

  <p class="auth-footer">
    CashFlex · Personal Finance Planner
  </p>

</div>
